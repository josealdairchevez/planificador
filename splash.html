<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000510">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Planificador JCH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000510;font-family:'Segoe UI',system-ui,sans-serif}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#scene{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;pointer-events:none}
.particle{position:absolute;opacity:0;pointer-events:none;left:var(--x,50%);top:110%;animation:floatUp var(--dur,4s) ease-in var(--delay,0s) forwards}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(.5);opacity:0}10%{opacity:1}80%{opacity:.8}100%{transform:translateY(calc(-115vh)) rotate(var(--rot,360deg)) scale(1.1);opacity:0}}
#launchPad{width:75vw;max-width:320px;height:10px;background:linear-gradient(90deg,transparent,#00d2ff,#00d2ff,transparent);border-radius:5px;box-shadow:0 0 30px #00d2ff,0 0 60px rgba(0,210,255,.4);position:relative;z-index:5;margin-bottom:0;opacity:0;animation:fadeIn .4s .5s forwards}
@keyframes fadeIn{to{opacity:1}}
#rocketWrapper{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;margin-bottom:-4px;animation:rocketLaunch 2.4s 2.2s cubic-bezier(.4,0,.2,1) forwards;transform-origin:bottom center}
@keyframes rocketLaunch{0%{transform:translateY(0) scale(1);filter:brightness(1)}12%{transform:translateY(10px) scale(.98);filter:brightness(1.5)}25%{transform:translateY(-15px) scale(1.02)}100%{transform:translateY(-130vh) scale(.25);filter:brightness(3) blur(4px);opacity:0}}
#rocket{width:clamp(75px,18vw,130px);height:auto;filter:drop-shadow(0 0 18px #00d2ff) drop-shadow(0 0 35px rgba(0,114,255,.6))}
#flame{width:clamp(28px,7vw,50px);animation:flameAnim .08s infinite alternate;margin-top:-3px;filter:drop-shadow(0 6px 18px #ff6600)}
@keyframes flameAnim{0%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.12) scaleY(1.18)}100%{transform:scaleX(.9) scaleY(.92)}}
.smoke{position:absolute;bottom:-8px;width:clamp(55px,14vw,90px);height:clamp(55px,14vw,90px);border-radius:50%;background:radial-gradient(circle,rgba(180,200,255,.5),transparent 70%);animation:smokeExp 2.4s var(--sd,2.2s) ease-out forwards;opacity:0;pointer-events:none}
@keyframes smokeExp{0%{transform:scale(.4);opacity:.9}100%{transform:scale(5);opacity:0}}
.shock{position:absolute;bottom:8px;width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,210,255,.85);animation:shockWave 1.1s var(--sd,2.2s) ease-out forwards;opacity:0;pointer-events:none}
@keyframes shockWave{0%{transform:scale(1);opacity:.95}100%{transform:scale(9);opacity:0}}
#trail{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:linear-gradient(to top,#ff6600,#ffaa00,#00d2ff,transparent);height:0;border-radius:2px;animation:trailG 2.4s 2.2s ease-in forwards;z-index:4}
@keyframes trailG{0%{height:0;opacity:1}55%{height:55vh;opacity:1}100%{height:100vh;opacity:0}}
#headerText{position:fixed;top:0;left:0;right:0;text-align:center;z-index:20;padding:clamp(18px,5vh,55px) 20px 0;opacity:0;animation:slideDown .7s .3s ease-out forwards}
@keyframes slideDown{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}
#appTitle{font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;text-transform:uppercase;letter-spacing:3px;background:linear-gradient(135deg,#fff 0%,#00f0ff 40%,#0072ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
#appSubtitle{font-size:clamp(.6rem,2.2vw,.85rem);color:rgba(0,210,255,.75);letter-spacing:2px;text-transform:uppercase;font-weight:600}
#motivText{position:fixed;bottom:clamp(75px,17vh,150px);left:0;right:0;text-align:center;z-index:20;padding:0 28px;opacity:0;animation:fadeInUp .8s 1.1s ease-out forwards}
@keyframes fadeInUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
#quote{font-size:clamp(.8rem,2.8vw,1rem);color:#fff;font-weight:700;line-height:1.55;font-style:italic;text-shadow:0 0 20px rgba(0,210,255,.5)}
#quoteAuthor{font-size:clamp(.6rem,1.8vw,.75rem);color:rgba(0,210,255,.55);margin-top:6px;letter-spacing:2px;text-transform:uppercase}
#loadBar{position:fixed;bottom:clamp(28px,7vh,55px);left:50%;transform:translateX(-50%);width:clamp(170px,55vw,280px);z-index:20;opacity:0;animation:fadeIn .5s 1.3s forwards}
#loadTrack{width:100%;height:4px;background:rgba(0,210,255,.15);border-radius:2px;overflow:hidden}
#loadFill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#00d2ff,#0072ff);box-shadow:0 0 10px #00d2ff;animation:loadProg 4.2s 1.3s cubic-bezier(.25,.1,.25,1) forwards}
@keyframes loadProg{to{width:100%}}
#loadLabel{text-align:center;margin-top:7px;font-size:clamp(.52rem,1.8vw,.68rem);color:rgba(0,210,255,.5);letter-spacing:2px;text-transform:uppercase;animation:pulseT .9s 1.3s ease-in-out infinite alternate}
@keyframes pulseT{to{color:rgba(0,210,255,.9)}}
#exitOverlay{position:fixed;inset:0;z-index:100;background:#001224;opacity:0;pointer-events:none;animation:exitFade .4s 5.1s ease-in forwards}
@keyframes exitFade{to{opacity:1}}
#planet{position:fixed;top:8%;right:5%;width:clamp(60px,15vw,110px);height:clamp(60px,15vw,110px);z-index:2;animation:planetFloat 6s ease-in-out infinite alternate;opacity:.8}
@keyframes planetFloat{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<svg id="planet" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pG" cx="35%" cy="30%">
      <stop offset="0%" style="stop-color:#9060e0"/><stop offset="60%" style="stop-color:#4020a0"/><stop offset="100%" style="stop-color:#1a0060"/>
    </radialGradient>
  </defs>
  <ellipse cx="60" cy="60" rx="54" ry="54" fill="url(#pG)" opacity=".8"/>
  <ellipse cx="60" cy="65" rx="82" ry="17" fill="none" stroke="rgba(160,100,255,.4)" stroke-width="10"/>
  <ellipse cx="43" cy="40" rx="13" ry="8" fill="rgba(200,160,255,.22)"/>
</svg>

<div id="headerText">
  <div id="appTitle">🚀 Planificador JCH</div>
  <div id="appSubtitle">Centro de Comando · Alto Rendimiento</div>
</div>

<div id="scene">
  <div id="particlesContainer" style="position:absolute;inset:0;pointer-events:none"></div>
  <div id="trail"></div>
  <div id="rocketWrapper">
    <svg id="rocket" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#5aabff"/><stop offset="50%" style="stop-color:#eaf4ff"/><stop offset="100%" style="stop-color:#5aabff"/></linearGradient>
        <linearGradient id="nG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#00eeff"/><stop offset="100%" style="stop-color:#0055dd"/></linearGradient>
        <radialGradient id="wG" cx="38%" cy="32%"><stop offset="0%" style="stop-color:#ffffff"/><stop offset="35%" style="stop-color:#00d2ff"/><stop offset="100%" style="stop-color:#002299"/></radialGradient>
        <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <polygon points="22,138 5,185 30,158" fill="#0066ee" opacity=".92"/>
      <polygon points="98,138 115,185 90,158" fill="#0066ee" opacity=".92"/>
      <rect x="28" y="78" width="64" height="105" rx="20" fill="url(#bG)"/>
      <rect x="28" y="78" width="22" height="105" rx="20" fill="rgba(0,40,120,.3)"/>
      <polygon points="60,8 28,78 92,78" fill="url(#nG)" filter="url(#gl)"/>
      <polygon points="60,8 28,78 44,78" fill="rgba(100,220,255,.4)"/>
      <circle cx="60" cy="112" r="21" fill="url(#wG)" stroke="white" stroke-width="3"/>
      <ellipse cx="52" cy="104" rx="8" ry="6" fill="rgba(255,255,255,.65)"/>
      <rect x="44" y="156" width="32" height="22" rx="8" fill="rgba(0,40,140,.5)"/>
      <line x1="60" y1="78" x2="60" y2="178" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
      <circle cx="35" cy="100" r="3" fill="rgba(255,255,255,.35)"/>
      <circle cx="85" cy="100" r="3" fill="rgba(255,255,255,.35)"/>
    </svg>
    <svg id="flame" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="fG" cx="50%" cy="5%"><stop offset="0%" style="stop-color:#ffffff"/><stop offset="25%" style="stop-color:#ffee00"/><stop offset="60%" style="stop-color:#ff6600"/><stop offset="100%" style="stop-color:transparent"/></radialGradient>
      </defs>
      <ellipse cx="30" cy="28" rx="24" ry="34" fill="url(#fG)" opacity=".95"/>
      <ellipse cx="30" cy="32" rx="14" ry="24" fill="#ffee00" opacity=".75"/>
      <ellipse cx="30" cy="22" rx="7" ry="14" fill="white" opacity=".85"/>
    </svg>
  </div>
  <div class="smoke" style="left:calc(50% - 45px);--sd:2.2s"></div>
  <div class="smoke" style="left:calc(50% - 15px);--sd:2.35s"></div>
  <div class="smoke" style="left:calc(50% + 15px);--sd:2.25s"></div>
  <div class="shock" style="--sd:2.2s"></div>
  <div class="shock" style="border-color:rgba(255,140,0,.7);--sd:2.45s"></div>
  <div class="shock" style="border-color:rgba(177,0,255,.5);--sd:2.7s"></div>
  <div id="launchPad"></div>
</div>

<div id="motivText">
  <div id="quote">"El éxito es la suma de pequeños esfuerzos<br>repetidos día tras día."</div>
  <div id="quoteAuthor">— Robert Collier</div>
</div>

<div id="loadBar">
  <div id="loadTrack"><div id="loadFill"></div></div>
  <div id="loadLabel">Iniciando sistema...</div>
</div>
<div id="exitOverlay"></div>

<script>
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W,H,stars=[],shooting=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;stars=Array.from({length:220},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.3,speed:Math.random()*.35+.04,alpha:Math.random(),da:(Math.random()-.5)*.022,cyan:Math.random()>.72}));}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#000508');g.addColorStop(.55,'#000e28');g.addColorStop(1,'#000618');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  [[W*.15,H*.3,200,'rgba(0,30,120,'],[W*.8,H*.65,160,'rgba(60,0,120,'],[W*.5,H*.15,140,'rgba(0,60,100,']].forEach(([nx,ny,nr,nc])=>{
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);ng.addColorStop(0,nc+'.15)');ng.addColorStop(1,nc+'0)');ctx.fillStyle=ng;ctx.beginPath();ctx.arc(nx,ny,nr,0,Math.PI*2);ctx.fill();
  });
  stars.forEach(s=>{
    s.alpha+=s.da;if(s.alpha>1||s.alpha<.05)s.da*=-1;s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}
    ctx.save();ctx.globalAlpha=Math.max(.05,Math.min(1,s.alpha));ctx.fillStyle=s.cyan?'#00d2ff':'#fff';ctx.shadowColor=s.cyan?'#00d2ff':'#fff';ctx.shadowBlur=s.r>1.4?5:1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  if(Math.random()<.007){shooting.push({x:Math.random()*W*.7,y:Math.random()*H*.4,vx:Math.random()*5+3,vy:Math.random()*3+2,life:0});}
  shooting=shooting.filter(ss=>{ss.x+=ss.vx;ss.y+=ss.vy;ss.life++;const a=Math.max(0,1-ss.life/38);if(a<=0)return false;ctx.save();ctx.globalAlpha=a*.8;ctx.strokeStyle='rgba(200,230,255,.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ss.x,ss.y);ctx.lineTo(ss.x-ss.vx*8,ss.y-ss.vy*8);ctx.stroke();ctx.restore();return true;});
}

let raf;function animate(){drawBg();raf=requestAnimationFrame(animate);}
window.addEventListener('resize',resize);resize();animate();

const icons=['📚','🎓','⭐','🧠','💡','📐','🔬','🏆','📝','⚡','🌟','💎','📊','🎯','🔭','✏️','🏅','📖'];
const pc=document.getElementById('particlesContainer');
function spawnP(){
  const el=document.createElement('div');el.className='particle';
  el.textContent=icons[Math.floor(Math.random()*icons.length)];
  const dur=(Math.random()*2.8+3.2).toFixed(1),delay=(Math.random()*1.2).toFixed(1),x=(Math.random()*88+4).toFixed(0),rot=(Math.random()>.5?1:-1)*(Math.random()*300+160);
  el.style.cssText=`--dur:${dur}s;--delay:${delay}s;--x:${x}%;--rot:${rot}deg;font-size:${Math.random()*14+14}px`;
  pc.appendChild(el);setTimeout(()=>el.remove(),(parseFloat(dur)+parseFloat(delay)+.5)*1000);
}
setTimeout(()=>{for(let i=0;i<22;i++)setTimeout(spawnP,i*160);let iv=setInterval(spawnP,320);setTimeout(()=>clearInterval(iv),4500);},700);

const msgs=['Iniciando sistema...','Cargando módulos...','Sincronizando datos...','Preparando misión...','¡Listo para despegar! 🚀'];
const lbl=document.getElementById('loadLabel');let mi=0;
const li=setInterval(()=>{lbl.textContent=msgs[Math.min(++mi,msgs.length-1)];if(mi>=msgs.length-1)clearInterval(li);},780);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js')
    .then(r=>{if(r.waiting)r.waiting.postMessage({type:'SKIP_WAITING'});})
    .catch(e=>console.warn('[SW]',e));
}

setTimeout(()=>{cancelAnimationFrame(raf);window.location.replace('./index.html');},5600);
</script>
</body>
</html>
